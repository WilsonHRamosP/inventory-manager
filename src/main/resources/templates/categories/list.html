<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categorías - Inventory Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #212529;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin-bottom: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            margin: 0;
            color: #333;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            background-color: #212529;
        }

        .btn:hover {
            background-color: #343a40;
        }

        .table-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f4f6f8;
            color: #555;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .actions a {
            margin-right: 10px;
            text-decoration: none;
        }

        .edit {
            color: #0d6efd;
        }

        .delete {
            color: #dc3545;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .navigation {
            margin-top: 30px;
        }

        .navigation a {
            display: inline-block;
            margin-right: 10px;
            padding: 10px 15px;
            background-color: #212529;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .navigation a:hover {
            background-color: #343a40;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Inventory Manager</h1>
    <p>Gestión de Categorías</p>
</div>

<div class="container">

    <div class="top-bar">

        <h2>🏷️ Categorías</h2>

        <a th:href="@{/categories/new}"
           sec:authorize="hasRole('ADMIN')">
            + Nueva categoría
        </a>

    </div>

    <div class="table-container">

        <table th:if="${!categories.isEmpty()}">

            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="category : ${categories}">

                <td th:text="${category.id}">
                    1
                </td>

                <td th:text="${category.name}">
                    Categoría
                </td>

                <td class="actions"
                    sec:authorize="hasRole('ADMIN')">

                    <a th:href="@{/categories/edit/{id}(id=${category.id})}"
                       sec:authorize="hasRole('ADMIN')">
                        ✏️ Editar
                    </a>

                    <a th:href="@{/categories/delete/{id}(id=${category.id})}"
                       sec:authorize="hasRole('ADMIN')">
                        🗑️ Eliminar
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

        <div class="empty"
             th:if="${categories.isEmpty()}">

            🏷️ No hay categorías registradas.

        </div>

    </div>

    <div class="navigation">

        <a href="/dashboard">Dashboard</a>

        <a href="/products">Productos</a>

        <a href="/categories">Categorías</a>

        <a href="/sales">Ventas</a>

    </div>

</div>

</body>

</html>
