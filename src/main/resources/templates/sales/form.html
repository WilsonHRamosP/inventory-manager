<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${sale.id == null ? 'Nueva Venta' : 'Editar Venta'}">
        Venta - Inventory Manager
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #212529;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin-bottom: 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .form-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #555;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #212529;
        }

        .products-title {
            margin-top: 30px;
            margin-bottom: 15px;
            color: #333;
        }

        .sale-item {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .sale-item label {
            margin-top: 10px;
        }

        .sale-item label:first-child {
            margin-top: 0;
        }

        .item-row {
            display: grid;
            grid-template-columns: 1fr 180px auto;
            gap: 15px;
            align-items: end;
        }

        .item-field label {
            margin-top: 0;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-add {
            background-color: #198754;
            color: white;
            margin-bottom: 20px;
        }

        .btn-add:hover {
            background-color: #157347;
        }

        .btn-remove {
            background-color: #dc3545;
            color: white;
        }

        .btn-remove:hover {
            background-color: #bb2d3b;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .btn-save {
            background-color: #212529;
            color: white;
        }

        .btn-save:hover {
            background-color: #343a40;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #5c636a;
        }

        .navigation {
            margin-top: 30px;
        }

        .navigation a {
            display: inline-block;
            margin-right: 10px;
            padding: 10px 15px;
            background-color: #212529;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .navigation a:hover {
            background-color: #343a40;
        }

        @media (max-width: 700px) {

            .item-row {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
            }

        }
    </style>
</head>

<body>

<div class="header">
    <h1>Inventory Manager</h1>
    <p>Gestión de Ventas</p>
</div>

<div class="container">

    <div class="form-card">

        <h2 th:text="${sale.id == null ? '🧾 Nueva Venta' : '✏️ Editar Venta'}">
            Venta
        </h2>

        <form th:action="@{/sales/save}" method="post">

            <input type="hidden"
                   name="id"
                   th:value="${sale.id}">

            <!-- FECHA -->

            <div class="form-group">

                <label for="date">
                    Fecha de la venta:
                </label>

                <input type="datetime-local"
                       id="date"
                       name="date"
                       th:value="${sale.date != null ? #temporals.format(sale.date, 'yyyy-MM-dd''T''HH:mm') : ''}"
                       required>

            </div>


            <!-- PRODUCTOS -->

            <h2 class="products-title">
                🛒 Productos
            </h2>

            <div id="items-container">

                <div class="sale-item">

                    <div class="item-row">

                        <div class="item-field">

                            <label>
                                Producto:
                            </label>

                            <select name="items[0].product.id"
                                    onchange="updateMaxStock(this)"
                                    required>

                                <option value="">
                                    -- Seleccione un producto --
                                </option>

                                <option th:each="product : ${products}"
                                        th:value="${product.id}"
                                        th:data-stock="${product.stock}"
                                        th:text="${product.name + ' - $' + product.price + ' | Stock: ' + product.stock}">
                                </option>

                            </select>

                        </div>

                        <div class="item-field">

                            <label>
                                Cantidad:
                            </label>

                            <input type="number"
                                   name="items[0].quantity"
                                   min="1"
                                   value="1"
                                   required>

                        </div>

                    </div>

                </div>

            </div>


            <!-- AGREGAR PRODUCTO -->

            <button type="button"
                    class="btn btn-add"
                    onclick="addItem()">

                + Agregar producto

            </button>


            <!-- BOTONES -->

            <div class="buttons">

                <button type="submit"
                        class="btn btn-save">

                    💾 Guardar venta

                </button>

                <a th:href="@{/sales}"
                   class="btn btn-cancel">

                    ↩️ Cancelar

                </a>

            </div>

        </form>

    </div>


    <!-- NAVEGACIÓN -->

    <div class="navigation">

        <a href="/dashboard">Dashboard</a>

        <a href="/products">Productos</a>

        <a href="/categories">Categorías</a>

        <a href="/sales">Ventas</a>

    </div>

</div>


<!-- PLANTILLA DE PRODUCTOS -->

<select id="product-template" style="display:none;">

    <option value="">
        -- Seleccione un producto --
    </option>

    <option th:each="product : ${products}"
            th:value="${product.id}"
            th:data-stock="${product.stock}"
            th:text="${product.name + ' - $' + product.price + ' | Stock: ' + product.stock}">
    </option>

</select>


<script>

    let itemIndex = 1;


    function updateMaxStock(select) {

        const selectedOption =
            select.options[select.selectedIndex];

        const stock =
            selectedOption.getAttribute("data-stock");

        const item =
            select.closest(".sale-item");

        const quantity =
            item.querySelector('input[type="number"]');

        if (stock) {

            quantity.max = stock;

            if (parseInt(quantity.value) > parseInt(stock)) {

                quantity.value = stock;

            }

        }

    }


    function getSelectedProducts() {

        const selects =
            document.querySelectorAll(
                '#items-container select'
            );

        const selected = [];

        selects.forEach(function(select) {

            if (select.value !== "") {

                selected.push(select.value);

            }

        });

        return selected;

    }


    function validateProduct(select) {

        const selectedProducts =
            getSelectedProducts();

        const currentValue =
            select.value;

        let count = 0;

        selectedProducts.forEach(function(productId) {

            if (productId === currentValue) {

                count++;

            }

        });

        if (count > 1) {

            alert(
                "Este producto ya fue agregado a la venta."
            );

            select.value = "";

            updateMaxStock(select);

            return false;

        }

        return true;

    }


    function addItem() {

        const container =
            document.getElementById("items-container");

        const productTemplate =
            document.getElementById("product-template");

        const item =
            document.createElement("div");

        item.classList.add("sale-item");


        const row =
            document.createElement("div");

        row.classList.add("item-row");


        const productField =
            document.createElement("div");

        productField.classList.add("item-field");


        const productLabel =
            document.createElement("label");

        productLabel.textContent =
            "Producto:";


        const select =
            document.createElement("select");

        select.name =
            "items[" + itemIndex + "].product.id";

        select.required = true;

        select.innerHTML =
            productTemplate.innerHTML;


        select.onchange = function() {

            if (validateProduct(this)) {

                updateMaxStock(this);

            }

        };


        productField.appendChild(productLabel);

        productField.appendChild(select);


        const quantityField =
            document.createElement("div");

        quantityField.classList.add("item-field");


        const quantityLabel =
            document.createElement("label");

        quantityLabel.textContent =
            "Cantidad:";


        const quantity =
            document.createElement("input");

        quantity.type = "number";

        quantity.name =
            "items[" + itemIndex + "].quantity";

        quantity.min = "1";

        quantity.value = "1";

        quantity.required = true;


        quantityField.appendChild(quantityLabel);

        quantityField.appendChild(quantity);


        const removeButton =
            document.createElement("button");

        removeButton.type = "button";

        removeButton.classList.add("btn");

        removeButton.classList.add("btn-remove");

        removeButton.textContent =
            "🗑️ Eliminar";


        removeButton.onclick = function() {

            item.remove();

        };


        row.appendChild(productField);

        row.appendChild(quantityField);

        row.appendChild(removeButton);


        item.appendChild(row);

        container.appendChild(item);

        itemIndex++;

    }


    document.querySelector("form").addEventListener(
        "submit",
        function(event) {

            const selectedProducts =
                getSelectedProducts();

            const uniqueProducts =
                new Set(selectedProducts);

            if (
                selectedProducts.length !==
                uniqueProducts.size
            ) {

                event.preventDefault();

                alert(
                    "No puedes agregar el mismo producto más de una vez."
                );

            }

        }
    );

</script>

</body>

</html>
