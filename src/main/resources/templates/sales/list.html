<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ventas - Inventory Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #212529;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin-bottom: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            margin: 0;
            color: #333;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            background-color: #212529;
        }

        .btn:hover {
            background-color: #343a40;
        }

        .table-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f4f6f8;
            color: #555;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .actions a {
            margin-right: 10px;
            text-decoration: none;
        }

        .view {
            color: #198754;
        }

        .edit {
            color: #0d6efd;
        }

        .delete {
            color: #dc3545;
        }

        .total {
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .navigation {
            margin-top: 30px;
        }

        .navigation a {
            display: inline-block;
            margin-right: 10px;
            padding: 10px 15px;
            background-color: #212529;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .navigation a:hover {
            background-color: #343a40;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Inventory Manager</h1>
    <p>Gestión de Ventas</p>
</div>

<div class="container">

    <div class="top-bar">

        <h2>🧾 Ventas</h2>

        <a class="btn" th:href="@{/sales/new}">
            + Nueva venta
        </a>

    </div>

    <div class="table-container">

        <table th:if="${!#lists.isEmpty(sales)}">

            <thead>
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="sale : ${sales}">

                <td th:text="${sale.id}">
                    1
                </td>

                <td th:text="${sale.date}">
                    2026-08-26
                </td>

                <td class="total">
                    $<span th:text="${sale.total}">
                        0.00
                    </span>
                </td>

                <td class="actions">

                    <a class="view"
                       th:href="@{/sales/view/{id}(id=${sale.id})}">
                        👁️ Ver
                    </a>

                    <a class="edit"
                       th:href="@{/sales/edit/{id}(id=${sale.id})}">
                        ✏️ Editar
                    </a>

                    <a class="delete"
                       th:href="@{/sales/delete/{id}(id=${sale.id})}"
                       onclick="return confirm('¿Está seguro de eliminar esta venta?')">
                        🗑️ Eliminar
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

        <div class="empty"
             th:if="${#lists.isEmpty(sales)}">

            🧾 No hay ventas registradas.

        </div>

    </div>

    <div class="navigation">

        <a href="/dashboard">Dashboard</a>

        <a href="/products">Productos</a>

        <a href="/categories">Categorías</a>

        <a href="/sales">Ventas</a>

    </div>

</div>

</body>

</html>
