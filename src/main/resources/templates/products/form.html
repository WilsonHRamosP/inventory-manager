<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${product.id == null ? 'Nuevo Producto' : 'Editar Producto'}">
        Producto - Inventory Manager
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #212529;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin-bottom: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
        }

        .form-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #555;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #212529;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-save {
            background-color: #212529;
            color: white;
        }

        .btn-save:hover {
            background-color: #343a40;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #5c636a;
        }

        .navigation {
            margin-top: 30px;
        }

        .navigation a {
            display: inline-block;
            margin-right: 10px;
            padding: 10px 15px;
            background-color: #212529;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .navigation a:hover {
            background-color: #343a40;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Inventory Manager</h1>
    <p>Gestión de Productos</p>
</div>

<div class="container">

    <div class="form-card">

        <h2 th:text="${product.id == null ? '📦 Nuevo Producto' : '✏️ Editar Producto'}">
            Producto
        </h2>

        <form th:action="@{/products/save}"
              th:object="${product}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">

                <label for="name">Nombre:</label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="Ingrese el nombre del producto"
                       required>

            </div>

            <div class="form-group">

                <label for="description">Descripción:</label>

                <textarea id="description"
                          th:field="*{description}"
                          placeholder="Ingrese una descripción del producto">
                </textarea>

            </div>

            <div class="form-group">

                <label for="price">Precio:</label>

                <input type="number"
                       id="price"
                       th:field="*{price}"
                       step="0.01"
                       min="0"
                       placeholder="0.00"
                       required>

            </div>

            <div class="form-group">

                <label for="stock">Stock:</label>

                <input type="number"
                       id="stock"
                       th:field="*{stock}"
                       min="0"
                       placeholder="0"
                       required>

            </div>

            <div class="form-group">

                <label for="category">Categoría:</label>

                <select id="category"
                        th:field="*{category}"
                        required>

                    <option value="">
                        Seleccione una categoría
                    </option>

                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}">
                    </option>

                </select>

            </div>

            <div class="buttons">

                <button type="submit"
                        class="btn btn-save">
                    💾 Guardar
                </button>

                <a th:href="@{/products}"
                   class="btn btn-cancel">
                    ↩️ Cancelar
                </a>

            </div>

        </form>

    </div>

    <div class="navigation">

        <a href="/dashboard">Dashboard</a>

        <a href="/products">Productos</a>

        <a href="/categories">Categorías</a>

        <a href="/sales">Ventas</a>

    </div>

</div>

</body>

</html>
